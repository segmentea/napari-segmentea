name: napari-segmentea
display_name: Segmentea
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: napari-segmentea.write_multiple
      python_name: napari_segmentea._writer:write_multiple
      title: Save multi-layer data with Segmentea
    - id: napari-segmentea.write_single_image
      python_name: napari_segmentea._writer:write_single_image
      title: Save image data with Segmentea
    - id: napari-segmentea.make_container_widget
      python_name: napari_segmentea._widget:ImageThreshold
      title: Make threshold Container widget
    - id: napari-segmentea.make_magic_widget
      python_name: napari_segmentea._widget:threshold_magic_widget
      title: Make threshold magic widget
    - id: napari-segmentea.make_function_widget
      python_name: napari_segmentea._widget:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: napari-segmentea.make_qwidget
      python_name: napari_segmentea._widget:ExampleQWidget
      title: Make example QWidget
  writers:
    - command: napari-segmentea.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-segmentea.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  widgets:
    - command: napari-segmentea.make_container_widget
      display_name: Container Threshold
    - command: napari-segmentea.make_magic_widget
      display_name: Magic Threshold
    - command: napari-segmentea.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: napari-segmentea.make_qwidget
      display_name: Example QWidget
  menus:
    napari/layers/segment:
      - command: napari-segmentea.make_container_widget
      - command: napari-segmentea.make_magic_widget
      - command: napari-segmentea.make_function_widget
      - command: napari-segmentea.make_qwidget
